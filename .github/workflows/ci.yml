name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the older run. Pushes to main get a
# group of their own per commit: GitHub also cancels *queued* runs in a shared
# group, so a shared main group would leave a merged commit without a status.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # Node version comes from `engines.node`, pnpm store from the lockfile.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turbo task cache and Next's build cache. Without an exact match GitHub
      # restores the newest entry from this branch or from main.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .turbo/cache
            apps/web/.next/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # `web#build` depends on `check`, which depends on `generate`, so the
      # three tasks that regenerate the content never run concurrently.
      # `//#format:check` covers the root files, `web#format:check` the package.
      - run: pnpm exec turbo run check lint test build format:check --filter=web --filter=//

      # Every run restores the previous entry and adds to it, so drop task
      # artifacts untouched for a week before the post-step saves the cache.
      - if: always()
        run: find .turbo/cache -type f -mtime +7 -delete

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner ships rustup; this installs the channel and components
      # pinned in rust-toolchain.toml.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --all --check

      # Alias defined in .cargo/config.toml; same command as `turbo run lint`.
      - run: cargo lint

      - run: cargo test --workspace --locked

      # Schema and graph rules over content/concepts (see content/README.md).
      - run: cargo run -p lexicon --locked -- validate
