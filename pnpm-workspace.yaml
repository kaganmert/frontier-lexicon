packages:
  - "apps/*"
  - "packages/*"

# esbuild (via @content-collections/mdx) needs its postinstall to place the binary.
allowBuilds:
  esbuild: true

# pnpm 11 holds back packages younger than minimumReleaseAge; next 16.4.5 is a
# security patch released on 2026-11-03, so it is excluded on purpose.
minimumReleaseAgeExclude:
  - "@next/env@16.4.5"
  - "@next/eslint-plugin-next@16.4.5"
  - "@next/swc-darwin-arm64@16.4.5"
  - "@next/swc-darwin-x64@16.4.5"
  - "@next/swc-linux-arm64-gnu@16.4.5"
  - "@next/swc-linux-arm64-musl@16.4.5"
  - "@next/swc-linux-x64-gnu@16.4.5"
  - "@next/swc-linux-x64-musl@16.4.5"
  - "@next/swc-win32-arm64-msvc@16.4.5"
  - "@next/swc-win32-x64-msvc@16.4.5"
  - "eslint-config-next@16.4.5"
  - "next@16.4.5"
