[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.metadata]
name = "frontier-lexicon-rust"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/kaganmert/frontier-lexicon"

[workspace.dependencies]
lexicon-core = { path = "crates/lexicon-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
url = "2.5"
petgraph = { version = "0.8", default-features = false, features = ["std", "graphmap"] }
assert_cmd = "2.2"
insta = "1.49"
similar = "2.7"
